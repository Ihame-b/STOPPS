services:
  - type: web
    name: stopps-ecommerce
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn ecomproject.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: stopps-ecommerce.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: stopps-db
          property: connectionString

databases:
  - name: stopps-db
    plan: free
    databaseName: stopps
    user: stopps_user
